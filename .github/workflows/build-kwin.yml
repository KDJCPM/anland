name: Build Patched KWin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build patched kwin debs
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/work \
            -w /work/producers/kde/ubuntu2604_v5 \
            debian:trixie bash -c '
              set -e
              apt-get update
              apt-get install -y curl git sudo build-essential devscripts \
                dpkg-dev debhelper fakeroot cmake extra-cmake-modules \
                qt6-base-dev qt6-base-private-dev qt6-wayland-dev \
                libkf6config-dev libkf6configwidgets-dev libkf6coreaddons-dev \
                libkf6declarative-dev libkf6globalaccel-dev libkf6i18n-dev \
                libkf6itemmodels-dev libkf6itemviews-dev libkf6kiocore-dev \
                libkf6kiofilewidgets-dev libkf6kiogui-dev libkf6kiowidgets-dev \
                libkf6notifications-dev libkf6package-dev libkf6plasma-dev \
                libkf6plasmaquick-dev libkf6solid-dev libkf6unit-dev \
                libkf6windowsystem-dev libkf6xmlgui-dev libkf6auth-dev \
                libkf6authcore-dev libkf6codecs-dev libkf6dbusaddons-dev \
                libkf6doctools-dev libkf6iconthemes-dev libkf6textwidgets-dev \
                libkf6widgetsaddons-dev libkf6archive-dev libkf6crash-dev \
                libkfontinst-dev libkfontinstui-dev libkscreen-dev \
                libksgrd-dev libpowerdevilcore-dev libsystemd-dev \
                libwayland-dev wayland-protocols libxcb1-dev libxcb-composite0-dev \
                libxcb-damage0-dev libxcb-dpms0-dev libxcb-dri2-0-dev \
                libxcb-dri3-dev libxcb-glx0-dev libxcb-present-dev \
                libxcb-record0-dev libxcb-render0-dev libxcb-render-util0-dev \
                libxcb-res0-dev libxcb-shape0-dev libxcb-shm0-dev \
                libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev \
                libxcb-xkb-dev libxcb-xv0-dev libxcb-xvmc0-dev \
                libxcb-xtest0-dev libx11-xcb-dev libxkbcommon-dev \
                libxkbcommon-x11-dev libudev-dev libinput-dev \
                libgbm-dev libdrm-dev libegl-dev libgl-dev \
                libglib2.0-dev libpixman-1-dev libqrencode-dev \
                liblcms2-dev libpam0g-dev libattr1-dev \
                libssl-dev libcap-dev libaudit-dev \
                libdbus-1-dev libpolkit-gobject-1-dev \
                libappstream-dev liboverlay-egl-dev hwdata
              chmod +x build.sh
              ./build.sh
            '

      - name: Collect .deb files
        run: |
          mkdir -p debs
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/work \
            debian:trixie bash -c '
              cp ~/anland-debbuild/kwin/*.deb /work/debs/ 2>/dev/null || true
              cp ~/anland-debbuild/xwayland/*.deb /work/debs/ 2>/dev/null || true
            '

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: patched-kwin-debs
          path: debs/*.deb
          if-no-files-found: warn
