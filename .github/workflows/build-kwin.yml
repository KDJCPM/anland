name: Build Patched KWin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build patched kwin debs
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/work \
            -w /work/producers/kde/ubuntu2604_v5 \
            debian:trixie bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq curl git sudo devscripts dpkg-dev debhelper fakeroot
              chmod +x build.sh
              ./build.sh
            '

      - name: Collect .deb files
        run: |
          mkdir -p debs
          find ${{ github.workspace }} -name "*.deb" -path "*/anland-debbuild/*" -exec cp {} debs/ \; 2>/dev/null || true
          ls -la debs/

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: patched-kwin-debs
          path: debs/*.deb
          if-no-files-found: warn
